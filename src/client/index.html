<!doctype html>
<html lang="en" data-pi-web-loading>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>PI WEB</title>
    <script id="pi-web-theme-data" type="application/json"></script>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" crossorigin="use-credentials" href="%BASE_URL%manifest.webmanifest" />
    <style>
      :root {
        color-scheme: light dark;
        --pi-control-font-size: 16px;
        --pi-control-font-family: var(--pi-font, system-ui, sans-serif);
        --pi-control-monospace-font-family: var(--pi-mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace);
        /* A neutral startup palette follows the scheme; runtime themes own exact colours. */
        --pi-bg: var(--pi-initial-bg);
        --pi-initial-bg: Canvas;
        --pi-initial-text: CanvasText;
        --pi-surface: color-mix(in srgb, var(--pi-bg) 95%, var(--pi-text));
        --pi-surface-hover: color-mix(in srgb, var(--pi-bg) 90%, var(--pi-text));
        --pi-terminal-bg: #05070a;
        --pi-terminal-text: #e6edf3;
        --pi-border: color-mix(in srgb, var(--pi-bg) 75%, var(--pi-text));
        --pi-border-muted: color-mix(in srgb, var(--pi-bg) 88%, var(--pi-text));
        --pi-text: var(--pi-initial-text);
        --pi-text-secondary: var(--pi-text);
        --pi-text-bright: var(--pi-text);
        --pi-muted: color-mix(in srgb, var(--pi-text) 65%, var(--pi-bg));
        --pi-dim: color-mix(in srgb, var(--pi-text) 50%, var(--pi-bg));
        --pi-accent: #58a6ff;
        --pi-accent-border: #2f81f7;
        --pi-selection-bg: #0d2847;
        --pi-success: #3fb950;
        --pi-success-border: #238636;
        --pi-success-bg: #0f1b12;
        --pi-success-surface: #0f2a16;
        --pi-success-ring: #3fb95055;
        --pi-warning: #d29922;
        --pi-warning-border: #6e5200;
        --pi-warning-surface: #1f1a10;
        --pi-danger: #ff7b72;
        --pi-purple: #d2a8ff;
        --pi-purple-border: #a371f7;
        --pi-purple-surface: #21132f;
        --pi-overlay: #0008;
        --pi-shadow-soft: #0006;
        --pi-shadow: #0008;
        --pi-shadow-strong: #000b;
        --pi-bg-overlay-soft: color-mix(in srgb, var(--pi-bg) 87%, transparent);
        --pi-bg-overlay: color-mix(in srgb, var(--pi-bg) 90%, transparent);
        --pi-success-bg-overlay: #0f1b12ee;
        --pi-terminal-selection: #264f78;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--pi-bg); color: var(--pi-text); }
      body { min-height: 100dvh; }
      html[data-pi-web-loading] pi-web-app { visibility: hidden; }
      #pi-web-startup { --pi-startup-default-logo: #00f0d8; position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; color-scheme: var(--pi-startup-scheme, light dark); background: var(--pi-startup-background, Canvas); color: var(--pi-startup-foreground, CanvasText); font: 16px system-ui, sans-serif; }
      /* Keep the mark steady; only the small activity line moves. */
      #pi-web-startup svg { width: 96px; height: 16px; color: var(--pi-startup-logo, var(--pi-startup-default-logo)); fill: currentColor; }
      @media (prefers-color-scheme: light) { #pi-web-startup { --pi-startup-default-logo: #008c82; } }
      /* Deployment identity takes precedence over contributed logo colours. */
      html[data-pi-web-deployment="dev"] #pi-web-startup { --pi-startup-logo: #a371f7; }
      .pi-web-startup-activity { width: 96px; height: 2px; margin-top: 20px; overflow: hidden; color: var(--pi-startup-logo, var(--pi-startup-default-logo)); }
      .pi-web-startup-activity::after { content: ""; display: block; width: 24px; height: 100%; background: currentColor; animation: pi-web-startup-sweep 1400ms ease-in-out infinite; }
      @keyframes pi-web-startup-sweep { from { transform: translateX(-24px); } to { transform: translateX(96px); } }
      @media (prefers-reduced-motion: reduce) { .pi-web-startup-activity::after { animation: none; transform: translateX(36px); } }
      @media (forced-colors: active) {
        #pi-web-startup { background: Canvas; color: CanvasText; }
        #pi-web-startup svg, .pi-web-startup-activity { color: CanvasText; }
        .pi-web-startup-activity::after { background: CanvasText; }
      }
      html:not([data-pi-web-loading]) #pi-web-startup { display: none; }
    </style>
    <style id="pi-web-startup-theme"></style>
  </head>
  <body>
    <div id="pi-web-startup" role="status" aria-label="Loading PI WEB">
      <svg viewBox="0 0 768 128" aria-hidden="true"><rect width="768" height="128" /></svg>
      <span class="pi-web-startup-activity" aria-hidden="true"></span>
    </div>
    <pi-web-app></pi-web-app>
    <script type="module" src="/src/startup.ts"></script>
  </body>
</html>
