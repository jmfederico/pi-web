<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PI WEB</title>
    <meta name="theme-color" content="#1e1e2e" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <style>
      :root {
        color-scheme: dark;
        --pi-control-font-size: 16px;
        --pi-control-font-family: system-ui, sans-serif;
        --pi-control-monospace-font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --pi-bg: #1e1e2e;
        --pi-surface: #313244;
        --pi-surface-hover: #45475a;
        --pi-terminal-bg: #11111b;
        --pi-terminal-text: #cdd6f4;
        --pi-border: #585b70;
        --pi-border-muted: #45475a;
        --pi-text: #cdd6f4;
        --pi-text-secondary: #bac2de;
        --pi-text-bright: #cdd6f4;
        --pi-muted: #a6adc8;
        --pi-dim: #7f849c;
        --pi-accent: #cba6f7;
        --pi-accent-border: #8670a7;
        --pi-selection-bg: #3d3752;
        --pi-success: #a6e3a1;
        --pi-success-border: #709473;
        --pi-success-bg: #2c323a;
        --pi-success-surface: #374243;
        --pi-success-ring: #a6e3a155;
        --pi-warning: #f9e2af;
        --pi-warning-border: #978a75;
        --pi-warning-surface: #3d3940;
        --pi-danger: #f38ba8;
        --pi-purple: #b4befe;
        --pi-purple-border: #787eab;
        --pi-purple-surface: #36384f;
        --pi-overlay: #11111baa;
        --pi-shadow-soft: #11111b66;
        --pi-shadow: #11111b99;
        --pi-shadow-strong: #11111bcc;
        --pi-bg-overlay-soft: #1e1e2edd;
        --pi-bg-overlay: #1e1e2ee6;
        --pi-success-bg-overlay: #2c323aee;
        --pi-terminal-selection: #585b70;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--pi-bg); color: var(--pi-text); }
      body { min-height: 100dvh; }
    </style>
  </head>
  <body>
    <pi-web-app></pi-web-app>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
