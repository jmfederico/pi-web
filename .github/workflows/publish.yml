name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Build
        run: npm run build

      - name: Check delivery artifacts
        run: npm run check:artifacts

      - name: Smoke test npm 12 global package install
        run: npm run smoke:package-install

      - name: Smoke test Bun without Node
        run: |
          docker run --rm --init --user root -v "$PWD:/code:ro" -w /code \
            -e PI_WEB_SMOKE_PREFERENCE=auto -e PI_WEB_SMOKE_NODE_ABSENT=1 \
            oven/bun:1.4.3 bash -lc '
              apt-get update && apt-get install -y --no-install-recommends git ca-certificates &&
              bun scripts/smoke-bun-install.mjs
            '

      - name: Publish
        # Verify/build already ran above; publish the exact artifacts checked here.
        run: npm publish --access public --provenance --ignore-scripts

  deploy-docs:
    name: Deploy stable docs to pi-web.dev
    # Stable docs only move on GitHub Releases; the dev variant at pi-web.dev/dev/
    # deploys from main via docs-dev.yml. Skipped on manual workflow_dispatch runs.
    if: github.event_name == 'release'
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: docs-stable
      cancel-in-progress: false
    steps:
      # Release events check out the published tag, so docs match the npm release.
      - name: Checkout
        uses: actions/checkout@v5

      # Run the pinned Wrangler directly. wrangler-action's install probe logs a
      # spurious npm error and installs every project dependency to get Wrangler.
      # Keep the version in sync with docs-dev.yml and docs-hotfix.yml.
      - name: Deploy stable docs worker
        run: npx --yes wrangler@4.119.0 deploy --config docs/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
