name: Deploy dev docs

# Deploys the docs site from main to pi-web.dev/dev/ (worker pi-web-docs-dev).
# The stable site at pi-web.dev is deployed separately by publish.yml on GitHub Releases.
# Requires the CLOUDFLARE_API_TOKEN repository secret and CLOUDFLARE_ACCOUNT_ID variable.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/build-docs-dev.mjs"
      - ".github/workflows/docs-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Queue deployments instead of cancelling an in-flight wrangler upload.
  group: docs-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to pi-web.dev/dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Assemble dev docs
        run: node scripts/build-docs-dev.mjs
        env:
          GIT_SHA: ${{ github.sha }}

      # Run the pinned Wrangler directly. wrangler-action's install probe logs a
      # spurious npm error and installs every project dependency to get Wrangler.
      # Wrangler 4 is required: v3 rejects path-based routes for assets workers.
      # Keep the version in sync with publish.yml and docs-hotfix.yml.
      - name: Deploy dev docs worker
        run: npx --yes wrangler@4.119.0 deploy --config docs/wrangler.dev.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
